name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, cgalpha-test-runner]

    env:
      PATH: /home/vaclav/.local/bin:/home/vaclav/bin:/home/vaclav/.pyenv/versions/3.11.9/bin:${{ env.PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install -r requirements.txt
          python3.11 -m pip install pytest pytest-mock pygments

      - name: Run unit tests
        run: |
          unset PYTHONPATH
          python3.11 -m pytest -q -o addopts='' \
            cgalpha_v3/tests/test_signal_detector_integration.py \
            cgalpha_v3/tests/test_safety_envelope.py \
            cgalpha_v3/tests/test_restart_script_isolation.py
